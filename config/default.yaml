# Mantis-OS Default Configuration

runtime:
  heartbeat_interval: 10        # Sekunden zwischen Ticks
  max_retries: 3                # Retry bei Tool-Fehlern
  session_timeout: 3600         # Max Session-Dauer (Sek)

reflection:
  max_retries: 2                # Max RFL-Reruns pro Fehlerkette
  cooldown_ticks: 3             # Ticks Pause zwischen Reflections

llm:
  # Local-first: lmstudio (default) | ollama | openai | anthropic
  backend: "lmstudio"
  # LM Studio: model wird vom Server bestimmt, hier der aktuell geladene
  # Ollama: z.B. "llama3", "mistral", "codellama"
  # OpenAI: z.B. "gpt-4"
  model: "qwen3-coder-30b-a3b-instruct"
  # base_url wird aus DEFAULTS geladen wenn nicht gesetzt:
  #   lmstudio:  http://localhost:1234/v1
  #   ollama:    http://localhost:11434
  #   openai:    https://api.openai.com/v1
  # base_url: "http://localhost:1234/v1"
  temperature: 0.7
  max_tokens: 4096

aams:
  auto_workpaper: true          # Automatisch WP öffnen/schließen
  ltm_ingest_on_close: true     # LTM bei Session-Close aktualisieren
  workspace_path: "./WORKSPACE"

mesh:
  enabled: false                # MantisClaw aktivieren?
  relay_url: "ws://localhost:7777"
  board_port: 8080

security:
  permission_level: 2           # 1=read, 2=read+write, 3=full
  rate_limit_per_minute: 60
  audit_enabled: true

tools:
  filesystem:
    enabled: true
    allowed_paths: ["./WORKSPACE"]
  web:
    enabled: false
  code_exec:
    enabled: false
    sandbox: true
